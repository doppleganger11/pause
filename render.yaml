# Render blueprint. Set the secret values in the Render dashboard, never here.
services:
  - type: web
    name: pause
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - { key: NODE_VERSION, value: 24.14.1 }
      - { key: GEMINI_MODEL, value: gemini-3.5-flash }
      - { key: PAYPAL_CLIENT_ID, sync: false }
      - { key: PAYPAL_CLIENT_SECRET, sync: false }
      - { key: GEMINI_API_KEY, sync: false }
